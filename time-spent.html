<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Apps Do Children Use?</title>
<meta name="description" content="A visual look at which apps children spend the most time on, and what it means for parents guiding healthy screen habits.">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/time-spent.min.css">

  <script type="application/ld+json">
  {"@context": "https://schema.org", "@type": "WebPage", "name": "What Apps Do Children Use? — COMPUDON Junior", "url": "https://compudonjunior.com/time-spent.html", "description": "Reference data on social media and app usage among children, compiled for COMPUDON Junior's digital safety curriculum.", "isPartOf": {"@type": "EducationalOrganization", "name": "COMPUDON Junior", "url": "https://compudonjunior.com"}}
  </script>
</head>
<body>
  <div class="card">
    <div class="header">
      <p class="eyebrow">Children &amp; Technology</p>
  <h1 class="title">Social Media vs Educational app </h1>
    <h5 class="subtitle">Usage by children per age group </h5>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--purple);"></div>
          Ages 7–9
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: var(--blue);"></div>
          Ages 10–12
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="chart-area">

      <div class="group">
        <div class="bars">
          <div class="bar-wrap">
            <span class="pct">32%</span>
            <div class="bar purple" style="height: 32vh;"></div>
          </div>
          <div class="bar-wrap">
            <span class="pct">49%</span>
            <div class="bar blue" style="height: 49vh;"></div>
          </div>
        </div>
        <div class="label">Social media use</div>
      </div>

      <div class="group">
        <div class="bars">
          <div class="bar-wrap">
            <span class="pct">50%</span>
            <div class="bar purple" style="height: 50vh;"></div>
          </div>
          <div class="bar-wrap">
            <span class="pct">28%</span>
            <div class="bar blue" style="height: 28vh;"></div>
          </div>
        </div>
        <div class="label">Educational apps only</div>
      </div>

      <div class="group">
        <div class="bars">
          <div class="bar-wrap">
            <span class="pct">18%</span>
            <div class="bar purple" style="height: 18vh;"></div>
          </div>
          <div class="bar-wrap">
            <span class="pct">23%</span>
            <div class="bar blue" style="height: 23vh;"></div>
          </div>
        </div>
        <div class="label">No apps</div>
      </div>

    </div>
  </div>
</body>
</html>
